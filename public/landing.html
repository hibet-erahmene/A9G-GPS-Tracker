<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in | Fleet Command</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#eaf3ee;min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(20,55,42,.1);padding:32px;width:100%;max-width:400px}
.brand{font-weight:700;color:#1b4a38;text-align:center;margin-bottom:18px;display:block;text-decoration:none}
.tabs{display:flex;gap:6px;background:#f1f8f4;border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border:0;border-radius:9px;background:none;font-weight:600;color:#6b7f75;cursor:pointer}
.tabs button.on{background:#fff;color:#1b4a38;box-shadow:0 2px 6px rgba(20,55,42,.1)}
label{display:block;font-size:.72rem;font-weight:600;color:#6b7f75;text-transform:uppercase;margin:12px 0 5px}
input{width:100%;padding:11px 13px;border:1.5px solid #e1ebe5;border-radius:10px;font-size:.95rem}
input:focus{outline:0;border-color:#2f7a5a}
.go{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#1b4a38;color:#fff;font-weight:600;font-size:.95rem;cursor:pointer}
#msg{margin-top:12px;color:#b94a48;font-size:.85rem;min-height:1.2em;text-align:center}
.su{display:none}
</style></head><body>
<div class="box"><a class="brand" href="/">FLEET COMMAND</a>
<div class="tabs"><button id="t1" class="on">Sign in</button><button id="t2">Create account</button></div>
<div class="su"><label>Name</label><input id="name"><label>Company (optional)</label><input id="company"></div>
<label>Email</label><input id="email" type="email" autocomplete="email">
<label>Password (8+ characters)</label><input id="pw" type="password" autocomplete="current-password">
<button class="go" id="go">Sign in</button><div id="msg"></div></div>
<script>
let signup=false;
function mode(s){signup=s;t1.className=s?'':'on';t2.className=s?'on':'';document.querySelector('.su').style.display=s?'block':'none';go.textContent=s?'Create account':'Sign in';msg.textContent=''}
t1.onclick=()=>mode(false);t2.onclick=()=>mode(true);
if(new URLSearchParams(location.search).get('signup'))mode(true);
go.onclick=async()=>{
  go.disabled=true;msg.textContent='';
  try{
    const r=await fetch(signup?'/api/signup':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:document.getElementById('name').value,company:document.getElementById('company').value,email:document.getElementById('email').value,password:document.getElementById('pw').value})});
    const d=await r.json().catch(()=>({}));
    if(r.ok)location.href='/garage';else msg.textContent=d.error||(r.status===429?'Too many attempts, wait a minute':'Something went wrong');
  }catch(e){msg.textContent='Network error'}
  go.disabled=false;
};
pw.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});
</script></body></html>
